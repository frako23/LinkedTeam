services:
  db:
    image: postgres:13
    container_name: linkedteam_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: linkedteam
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  web:
    build: .
    container_name: linkedteam_web
    command: flask run --host=0.0.0.0 --port=5000
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/linkedteam # <--- ¡Aquí está el cambio!
      - FLASK_APP_KEY=${FLASK_APP_KEY:?define FLASK_APP_KEY en .env}
      - FLASK_ENV=${FLASK_ENV:-production}
      # ... otras variables de entorno
    depends_on:
      - db

volumes:
  postgres_data:
